[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "kenallclient"
description = "simple client for kenall.jp API service."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Atsushi Odagiri", email = "aodagx@gmail.com"},
]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
testing = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-mock",
]
dev = [
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/ken-all/python-kenallclient"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["kenallclient"]

[tool.hatch.envs.test]
features = ["testing"]

[tool.hatch.envs.test.scripts]
run = "pytest {args:tests}"

[tool.hatch.envs.lint]
features = ["dev"]

[tool.hatch.envs.lint.scripts]
check = [
    "ruff check kenallclient",
    "ruff format --check kenallclient",
    "mypy kenallclient",
]

[tool.ruff]
line-length = 88
target-version = "py37"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces, not tabs
indent-style = "space"

[tool.mypy]
packages = ["kenallclient"]
